name: Publish NuGet package

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer package version, for example 1.2.3 or 1.2.3-preview.1"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: nuget-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve and validate package version
        id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${DISPATCH_VERSION}"
          fi

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Invalid SemVer package version: ${VERSION}" >&2
            exit 1
          fi

          echo "value=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Restore
        env:
          # Ephemeral, step-scoped credential. The dependency package must grant this
          # repository Actions read access; no credential is written to NuGet.config.
          NuGetPackageSourceCredentials_github: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }};ValidAuthenticationTypes=Basic
        run: dotnet restore sql-storage-engine.sln --locked-mode

      - name: Build and test with warnings as errors
        run: dotnet test sql-storage-engine.sln --configuration Release --no-restore -warnaserror -m:1

      - name: Verify independently versioned package identities
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          test "${PACKAGE_VERSION}" = "$(dotnet msbuild sql-storage-engine/sql-storage-engine.csproj -getProperty:Version)"
          test "$(dotnet msbuild SqlStorageEngine.Core/SqlStorageEngine.Core.csproj -getProperty:Version)" = "1.0.0"

      - name: Pack core then compatibility at their committed versions
        run: |
          dotnet pack SqlStorageEngine.Core/SqlStorageEngine.Core.csproj --configuration Release --no-restore -warnaserror --output artifacts
          dotnet pack sql-storage-engine/sql-storage-engine.csproj --configuration Release --no-restore -warnaserror --output artifacts

      - name: Publish core before compatibility
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget push "artifacts/SqlStorageEngine.Core.1.0.0.nupkg" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key "${GITHUB_TOKEN}"
          dotnet nuget push "artifacts/SqlStorageEngine.Compatibility.${{ steps.version.outputs.value }}.nupkg" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key "${GITHUB_TOKEN}"
